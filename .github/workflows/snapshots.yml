# Refreshes the "In cinemas" + trending fallback snapshots every day, so the
# "Saved list · as of …" date on the site never goes stale.
#
# No app code runs here — just node scripts/snapshots.mjs, which calls TMDB
# through the same server code the site uses. It needs TMDB_TOKEN, stored as
# a repository secret (Settings → Secrets and variables → Actions).
#
# main is locked by a ruleset that only the owner and deploy keys may bypass
# (GitHub won't exempt the Actions bot on a personal-account repo), so the push
# goes over SSH with a write deploy key. Its private half is SNAPSHOT_DEPLOY_KEY,
# a secret of the "snapshots" environment, and that environment only deploys
# from main — a workflow on any other branch can't read the key.
name: Refresh snapshots

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read   # pushing uses the deploy key, not GITHUB_TOKEN

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: snapshots
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public/snapshots
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/snapshots.mjs
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/snapshots
          git diff --cached --quiet || git commit -m "chore: refresh daily snapshots"
          git push
