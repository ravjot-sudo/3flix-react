<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Who built 3Flix</title>
<desc id="desc">Counted from the git history: Ravjot — 23 commits · +18,857 −2,169 lines; Watson — 1 commit · +1 −1 lines; Claude — co-author on 11 of 24 commits. Beside it, 24 commits and 18,858 lines added, with a bar for every day's commits from 2026-09-11 to 2026-09-13.</desc>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.16,1,.3,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
  .rise { transform-box: fill-box; transform-origin: bottom; animation: rise 1s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: none; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .shine { animation: shine 3.2s ease-in-out 1.6s infinite; }
  @keyframes shine { 0%, 100% { opacity: 0; } 50% { opacity: .35; } }
</style>

