<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">Who built <tspan fill="#f6b519">3Flix.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">FROM THE GIT HISTORY · BARS ARE SHARE OF LINES CHANGED</text>

