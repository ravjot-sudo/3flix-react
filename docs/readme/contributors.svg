<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Who built 3Flix</title>
<desc id="desc">Counted from the git history: Ravjot — 33 commits · +19,668 −2,448 lines; Rishit — 1 commit · +1 −1 lines; Claude — co-author on 14 of 36 commits; Maulik — 2 commits, one line each. Beside it, 36 commits and 19,671 lines added, with a bar for every day's commits from 2026-09-11 to 2026-09-15.</desc>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.16,1,.3,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
  .rise { transform-box: fill-box; transform-origin: bottom; animation: rise 1s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: none; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .shine { animation: shine 3.2s ease-in-out 1.6s infinite; }
  @keyframes shine { 0%, 100% { opacity: 0; } 50% { opacity: .35; } }
</style>

<rect width="1200" height="510" fill="#0c0c0b"/>
<line x1="56" y1="52" x2="356" y2="52" stroke="#2a2a27"/>
<text class="mono" x="56" y="78" font-size="12" letter-spacing="2" fill="#f6b519">07</text>
<text class="mono" x="356" y="78" font-size="12" letter-spacing="3" text-anchor="end" fill="#74736b">CONTRIBUTORS</text>
<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">Who built <tspan fill="#f6b519">3Flix.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">FROM THE GIT HISTORY · BARS ARE SHARE OF LINES CHANGED</text>

