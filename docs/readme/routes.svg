<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">The 3Flix route map</title>
<desc id="desc">Two public routes — the home page and /signin — lead into a gold ProtectedRoute gate whose padlock opens and closes. Behind it: the library and a classic's player nested inside it, the movies catalogue and a film's page nested inside that, the watchlist, the about page, a redirect from /films to /library, and a 404 for anything else. Pulses of light travel along every connection.</desc>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .flow { stroke-dasharray: 5 11; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .shackle { animation: unlock 4.8s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes unlock { 0%, 30% { transform: none; } 42%, 82% { transform: translateY(-7px); } 94%, 100% { transform: none; } }
</style>

<rect width="1200" height="600" fill="#0c0c0b"/>
<line x1="56" y1="52" x2="356" y2="52" stroke="#2a2a27"/>
<text class="mono" x="56" y="78" font-size="12" letter-spacing="2" fill="#f6b519">05</text>
<text class="mono" x="356" y="78" font-size="12" letter-spacing="3" text-anchor="end" fill="#74736b">ROUTES</text>
<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">Two ways in, <tspan fill="#f6b519">then the gate.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">PUBLIC</text>
<text class="mono" x="640" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">BEHIND THE GATE</text>

<g class="appear" style="animation-delay:.3s">
  <path id="in0" d="M306 214 C346 214 340 259 380 259" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M306 214 C346 214 340 259 380 259" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="in1" d="M306 338 C346 338 340 311 380 311" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M306 338 C346 338 340 311 380 311" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r0" d="M570 285 C606 285 604 172 640 172" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M570 285 C606 285 604 172 640 172" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r1" d="M654 194 V224 H670" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M654 194 V224 H670" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r2" d="M570 285 C606 285 604 276 640 276" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M570 285 C606 285 604 276 640 276" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r3" d="M654 298 V328 H670" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M654 298 V328 H670" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r4" d="M570 285 C606 285 604 380 640 380" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M570 285 C606 285 604 380 640 380" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r5" d="M570 285 C606 285 604 432 640 432" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M570 285 C606 285 604 432 640 432" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="r6" d="M570 285 C606 285 604 484 640 484" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
