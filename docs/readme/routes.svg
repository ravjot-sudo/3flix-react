</g>

<text class="mono" x="56" y="578" font-size="11" letter-spacing="1.6" fill="#74736b">FILTERS, TABS AND SEARCH LIVE IN THE URL, SO BACK RETURNS TO THE SAME LIST AND ANY VIEW CAN BE SHARED</text>
</svg>
