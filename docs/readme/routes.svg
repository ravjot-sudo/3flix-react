  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="2.08s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#r4"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
