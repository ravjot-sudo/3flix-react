  <rect x="56" y="176" width="250" height="76" fill="#1b1b19" stroke="#2a2a27"/>
  <text class="mono" x="74" y="200" font-size="13" font-weight="700" fill="#f6b519">/</text>
  <text class="sans" x="74" y="223" font-size="17" font-weight="700" fill="#f0eee6">Home</text>
  <text class="mono" x="74" y="240" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">the opening, then the sign-in</text>
  <rect x="56" y="300" width="250" height="76" fill="#1b1b19" stroke="#2a2a27"/>
  <text class="mono" x="74" y="324" font-size="13" font-weight="700" fill="#f6b519">/signin</text>
  <text class="sans" x="74" y="347" font-size="17" font-weight="700" fill="#f0eee6">Sign in</text>
  <text class="mono" x="74" y="364" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">for links from outside</text>

  <rect x="380" y="200" width="190" height="170" fill="#f6b519" stroke="#f6b519"/>
  <g transform="translate(475 258)">
    <path class="shackle" d="M-11 -4v-10a11 11 0 0 1 22 0v10" fill="none" stroke="#0c0c0b" stroke-width="3.5"/>
    <rect x="-17" y="-4" width="34" height="26" fill="#0c0c0b"/>
    <circle cx="0" cy="7" r="3.5" fill="#f6b519"/>
  </g>
  <text class="mono" x="475" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#0c0c0b">&lt;ProtectedRoute&gt;</text>
  <text class="mono" x="475" y="334" text-anchor="middle" font-size="9.5" letter-spacing="0.3" fill="#0c0c0b">signed in? straight through</text>
  <text class="mono" x="475" y="350" text-anchor="middle" font-size="9.5" letter-spacing="0.3" fill="#0c0c0b">if not → /signin</text>

  <rect x="640" y="150" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="177" font-size="13" font-weight="600" fill="#f0eee6">/library</text>
  <text class="mono" x="1128" y="177" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">new &amp; popular · free classics</text>
  <rect x="670" y="202" width="474" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="686" y="229" font-size="13" font-weight="600" fill="#f0eee6">/library/:filmId</text>
  <text class="mono" x="1128" y="229" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">a classic's player</text>
  <rect x="640" y="254" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="281" font-size="13" font-weight="600" fill="#f0eee6">/movies</text>
  <text class="mono" x="1128" y="281" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">the TMDB catalogue</text>
  <rect x="670" y="306" width="474" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="686" y="333" font-size="13" font-weight="600" fill="#f0eee6">/movies/:movieId</text>
  <text class="mono" x="1128" y="333" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">trailer · scores · where to watch</text>
  <rect x="640" y="358" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="385" font-size="13" font-weight="600" fill="#f0eee6">/watchlist</text>
  <text class="mono" x="1128" y="385" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">the films you saved</text>
  <rect x="640" y="410" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="437" font-size="13" font-weight="600" fill="#f0eee6">/about</text>
  <text class="mono" x="1128" y="437" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">where everything comes from</text>
  <rect x="640" y="462" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="489" font-size="13" font-weight="600" fill="#f0eee6">/films</text>
  <text class="mono" x="1128" y="489" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">↪ redirects to /library</text>
  <rect x="640" y="514" width="504" height="44" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="656" y="541" font-size="13" font-weight="600" fill="#f0eee6">*</text>
  <text class="mono" x="1128" y="541" text-anchor="end" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">404 · no such page</text>

  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="0.40s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#in0"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="0.68s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#in1"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="0.96s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#r0"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="1.24s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#r1"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="2.2s" begin="1.52s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#r2"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
