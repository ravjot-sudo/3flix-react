<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">How 3Flix deploys</title>
<desc id="desc">A push to main travels into a Vercel build, whose log fills in line by line while a progress bar runs; the build splits into the static site and four /api functions, and the live address switches from Building to Ready. Below, a GitHub Action refreshes the saved film lists every morning and commits them, which deploys the site again.</desc>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .flow { stroke-dasharray: 5 11; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .log0 { animation: log0 8s steps(1, end) infinite; }
  @keyframes log0 { 0%, 10% { opacity: 0; } 11%, 100% { opacity: 1; } }
  .log1 { animation: log1 8s steps(1, end) infinite; }
  @keyframes log1 { 0%, 24% { opacity: 0; } 25%, 100% { opacity: 1; } }
  .log2 { animation: log2 8s steps(1, end) infinite; }
  @keyframes log2 { 0%, 38% { opacity: 0; } 39%, 100% { opacity: 1; } }
  .prog { transform-box: fill-box; transform-origin: left; animation: prog 8s ease-in-out infinite; }
  @keyframes prog { 0%, 8% { transform: scaleX(0); } 58%, 100% { transform: scaleX(1); } }
  .building { opacity: 0; animation: building 8s steps(1, end) infinite; }
  @keyframes building { 0%, 63% { opacity: 1; } 64%, 100% { opacity: 0; } }
  .ready { animation: ready 8s steps(1, end) infinite; }
  @keyframes ready { 0%, 63% { opacity: 0; } 64%, 100% { opacity: 1; } }
  .blink { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>

<rect width="1200" height="500" fill="#0c0c0b"/>
<line x1="56" y1="52" x2="356" y2="52" stroke="#2a2a27"/>
<text class="mono" x="56" y="78" font-size="12" letter-spacing="2" fill="#f6b519">06</text>
<text class="mono" x="356" y="78" font-size="12" letter-spacing="3" text-anchor="end" fill="#74736b">DEPLOYING</text>
<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">Push to main, <tspan fill="#f6b519">and it's live.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">EVERY PUSH</text>

<g class="appear" style="animation-delay:.3s">
  <path id="a" d="M252 224 H300" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M252 224 H300" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="b1" d="M600 190 C626 190 620 182 646 182" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M600 190 C626 190 620 182 646 182" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="b2" d="M600 260 C626 260 620 268 646 268" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M600 260 C626 260 620 268 646 268" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="c1" d="M898 182 C924 182 918 210 944 210" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M898 182 C924 182 918 210 944 210" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="c2" d="M898 268 C924 268 918 238 944 238" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M898 268 C924 268 918 238 944 238" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
  <path id="e" d="M306 408 H340" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M306 408 H340" fill="none" stroke="#3ecf8e" stroke-width="1.5" class="flow"/>
  <path id="f" d="M640 408 H674" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M640 408 H674" fill="none" stroke="#3ecf8e" stroke-width="1.5" class="flow"/>
  <path id="g" d="M809 380 V336 H154 V272" fill="none" stroke="#2a2a27" stroke-width="1.5"/>
  <path d="M809 380 V336 H154 V272" fill="none" stroke="#3ecf8e" stroke-width="1.5" class="flow"/>

  <rect x="56" y="176" width="196" height="96" fill="#1b1b19" stroke="#2a2a27"/>
  <text class="sans" x="74" y="210" font-size="18" font-weight="700" fill="#f0eee6">git push</text>
  <text class="mono" x="74" y="232" font-size="11" letter-spacing="0.4" fill="#f6b519">origin main</text>
  <text class="mono" x="74" y="252" font-size="10" letter-spacing="0.3" fill="#a8a79f">nothing else to run</text>

  <rect x="300" y="150" width="300" height="150" fill="#131312" stroke="#2a2a27"/>
  <text class="sans" x="320" y="180" font-size="18" font-weight="700" fill="#f0eee6">Vercel builds it</text>
  <text class="mono log0" x="320" y="208" font-size="11" letter-spacing="0.3" fill="#f0eee6">$ npm run build</text>
  <text class="mono log1" x="320" y="230" font-size="11" letter-spacing="0.3" fill="#a8a79f">✓ vite build · pages, styles, lists</text>
  <text class="mono log2" x="320" y="252" font-size="11" letter-spacing="0.3" fill="#a8a79f">✓ api/*.js → 4 functions</text>
  <rect x="320" y="278" width="260" height="4" fill="#2a2a27"/>
  <rect class="prog" x="320" y="278" width="260" height="4" fill="#f6b519"/>

  <rect x="646" y="150" width="252" height="64" fill="#131312" stroke="#2a2a27"/>
  <text class="sans" x="662" y="176" font-size="16" font-weight="700" fill="#f0eee6">dist/</text>
  <text class="mono" x="662" y="196" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">pages · styles · saved lists</text>
  <rect x="646" y="236" width="252" height="64" fill="#131312" stroke="#2a2a27"/>
  <text class="sans" x="662" y="262" font-size="16" font-weight="700" fill="#f6b519">/api/*</text>
  <text class="mono" x="662" y="282" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">tmdb · omdb · watchmode · signin</text>

  <rect x="944" y="176" width="200" height="96" fill="#1b1b19" stroke="#f6b519"/>
  <text class="sans" x="962" y="208" font-size="16" font-weight="800" fill="#f0eee6">3flix-react</text>
  <text class="mono" x="962" y="226" font-size="11" fill="#a8a79f">.vercel.app</text>
  <g class="building">
    <circle class="blink" cx="968" cy="249" r="5" fill="#f6b519"/>
    <text class="mono" x="980" y="253" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#f6b519">BUILDING</text>
  </g>
  <g class="ready">
    <circle cx="968" cy="249" r="5" fill="#4cd7a0"/>
    <text class="mono" x="980" y="253" font-size="10.5" font-weight="600" letter-spacing="1.6" fill="#4cd7a0">READY</text>
  </g>

  <text class="mono" x="56" y="368" font-size="11" letter-spacing="2.4" fill="#74736b">EVERY MORNING</text>
  <rect x="56" y="380" width="250" height="56" fill="#131312" stroke="#2a2a27"/>
  <text class="sans" x="72" y="404" font-size="15" font-weight="700" fill="#f0eee6">GitHub Actions</text>
  <text class="mono" x="72" y="422" font-size="10.5" letter-spacing="0.3" fill="#3ecf8e">daily · 05:17 UTC</text>
  <rect x="340" y="380" width="300" height="56" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="356" y="404" font-size="12" font-weight="700" fill="#f0eee6">node scripts/snapshots.mjs</text>
  <text class="mono" x="356" y="422" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">in cinemas + trending, from TMDB</text>
  <rect x="674" y="380" width="270" height="56" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="690" y="404" font-size="12" font-weight="700" fill="#f0eee6">commit public/snapshots</text>
  <text class="mono" x="690" y="422" font-size="10.5" letter-spacing="0.3" fill="#a8a79f">a push of its own → redeploys</text>

  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="1.8s" begin="0.40s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#a"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="1.8s" begin="0.70s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#b1"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="1.8s" begin="1.00s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#b2"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="1.8s" begin="1.30s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#c1"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#f6b519">
    <animateMotion dur="1.8s" begin="1.60s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#c2"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#3ecf8e">
    <animateMotion dur="1.8s" begin="1.90s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#e"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#3ecf8e">
    <animateMotion dur="1.8s" begin="2.20s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#f"/></animateMotion>
  </circle>
  <circle class="pulse-dot" r="4" fill="#3ecf8e">
    <animateMotion dur="3.4s" begin="2.50s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#g"/></animateMotion>
  </circle>
</g>

<text class="mono" x="56" y="478" font-size="11" letter-spacing="1.6" fill="#74736b">KEYS LIVE IN VERCEL → SETTINGS → ENVIRONMENT VARIABLES · THE FUNCTIONS READ THEM WHEN THEY RUN</text>
</svg>
