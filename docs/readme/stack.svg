  </g>
  <g class="bar" style="animation-delay:0.20s">
    <rect x="56" y="546" width="584" height="56" fill="#131312" stroke="#2a2a27"/>
    <rect x="56" y="546" width="4" height="56" fill="#3ecf8e"/>
    <text class="sans" x="82" y="571" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#f0eee6">Supabase</text>
    <text class="mono" x="82" y="590" font-size="11.5" letter-spacing="0.6" fill="#a8a79f">email-code sign-in · synced watchlist</text>
    <text class="mono" x="620" y="580" font-size="12" font-weight="600" letter-spacing="1" text-anchor="end" fill="#3ecf8e">2.116</text>
  </g>

