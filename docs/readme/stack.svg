<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">3Flix tech stack and architecture</title>
<desc id="desc">Left: the stack, built up layer by layer — framer-motion, React Router, React, plain CSS, Vite, Vercel Functions and Supabase — with a gold light scanning down it. Right: requests flowing from the browser to the site's own /api routes on Vercel, which add the keys and call TMDB, OMDb, Watchmode and Supabase; video streams straight from the Internet Archive and Blender.</desc>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .bar { animation: slide .8s cubic-bezier(.16,1,.3,1) both; }
  @keyframes slide { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
  /* The light only switches on once the stack has finished building. */
  .scan { animation: scan-in .6s ease-out 1.4s both, scan 9.8s cubic-bezier(.65,0,.35,1) 1.4s infinite both; }
  @keyframes scan-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scan { 0.00%, 10.29% { transform: translateY(0px); } 14.29%, 24.57% { transform: translateY(66px); } 28.57%, 38.86% { transform: translateY(132px); } 42.86%, 53.14% { transform: translateY(198px); } 57.14%, 67.43% { transform: translateY(264px); } 71.43%, 81.71% { transform: translateY(330px); } 85.71%, 96.00% { transform: translateY(396px); } 100% { transform: translateY(0px); } }
  .flow { stroke-dasharray: 5 11; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>

<rect width="1200" height="660" fill="#0c0c0b"/>

<!-- section rail, as on the site -->
<line x1="56" y1="52" x2="356" y2="52" stroke="#2a2a27"/>
<text class="mono" x="56" y="78" font-size="12" letter-spacing="2" fill="#f6b519">02</text>
<text class="mono" x="356" y="78" font-size="12" letter-spacing="3" text-anchor="end" fill="#74736b">TECH STACK</text>
<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">What 3Flix <tspan fill="#f6b519">runs on.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">THE STACK</text>
<text class="mono" x="700" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">HOW A REQUEST TRAVELS</text>

