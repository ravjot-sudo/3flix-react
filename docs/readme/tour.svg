<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .scroll { animation: scroll 16s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes scroll { 0%, 14.4% { transform: translateY(0px); } 20%, 34.4% { transform: translateY(-336px); } 40%, 54.4% { transform: translateY(-672px); } 60%, 74.4% { transform: translateY(-1008px); } 80%, 94.4% { transform: translateY(-1344px); } 100% { transform: translateY(0px); } }
  .thumb { animation: thumb 16s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes thumb { 0%, 14.4% { transform: translateY(0px); } 20%, 34.4% { transform: translateY(67.2px); } 40%, 54.4% { transform: translateY(134.4px); } 60%, 74.4% { transform: translateY(201.6px); } 80%, 94.4% { transform: translateY(268.8px); } 100% { transform: translateY(0px); } }
  .marker { animation: marker 16s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes marker { 0%, 14.4% { transform: translateY(0px); } 20%, 34.4% { transform: translateY(64px); } 40%, 54.4% { transform: translateY(128px); } 60%, 74.4% { transform: translateY(192px); } 80%, 94.4% { transform: translateY(256px); } 100% { transform: translateY(0px); } }
  .grade { animation: grade 12s linear infinite; }
  @keyframes grade { 0% { fill: #2f96bc; } 16.67% { fill: #7b61ff; } 33.33% { fill: #ff4114; } 50% { fill: #1ab8d1; } 66.67% { fill: #ff2f9c; } 83.33% { fill: #f6b519; } 100% { fill: #2f96bc; } }
  .fanL, .fanR, .front { transform-box: fill-box; transform-origin: 50% 100%; }
  .fanL { transform: rotate(-12deg); animation: fanL 4s ease-in-out infinite; }
  .fanR { transform: rotate(12deg); animation: fanR 4s ease-in-out infinite; }
  @keyframes fanL { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(-17deg) translateX(-4px); } }
  @keyframes fanR { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(17deg) translateX(4px); } }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.18); opacity: .5; } }
</style>

