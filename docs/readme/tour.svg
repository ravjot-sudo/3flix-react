<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">What's on the 3Flix home page</title>
<desc id="desc">A browser window scrolls through the home page on its own: the opening title sequence, Eight ways in (eight genres, each with a fanned deck of posters), Now showing (a filmstrip over a backdrop that changes colour), the top six since 2008, and this week's trending row. A list beside it marks the section on screen.</desc>
