<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">The three keys 3Flix uses</title>
<desc id="desc">Three switches — TMDB_TOKEN, OMDB_KEY and WATCHMODE_KEY — flip on one after another, and each lights up what it powers: the catalogue, critics' scores, and direct links to where each film streams. Beneath: the page itself holds no keys, and without one the site falls back to lists saved each morning.</desc>
<defs><linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f96bc"/><stop offset="1" stop-color="#2f96bc" stop-opacity=".35"/></linearGradient><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b61ff"/><stop offset="1" stop-color="#7b61ff" stop-opacity=".35"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4114"/><stop offset="1" stop-color="#ff4114" stop-opacity=".35"/></linearGradient><linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ab8d1"/><stop offset="1" stop-color="#1ab8d1" stop-opacity=".35"/></linearGradient><linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2f9c"/><stop offset="1" stop-color="#ff2f9c" stop-opacity=".35"/></linearGradient><linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6b519"/><stop offset="1" stop-color="#f6b519" stop-opacity=".35"/></linearGradient><linearGradient id="t6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ecf8e"/><stop offset="1" stop-color="#3ecf8e" stop-opacity=".35"/></linearGradient><linearGradient id="t7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4356c8"/><stop offset="1" stop-color="#4356c8" stop-opacity=".35"/></linearGradient><linearGradient id="t8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5231b"/><stop offset="1" stop-color="#e5231b" stop-opacity=".35"/></linearGradient><linearGradient id="t9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#00c8ff" stop-opacity=".35"/></linearGradient></defs>
<style>
  .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .pulse-dot { display: none; }
  }
  .flow { stroke-dasharray: 5 11; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
  .appear { animation: appear .9s cubic-bezier(.16,1,.3,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .track0 { fill: #f6b519; animation: track0 9s ease-in-out infinite; }
  @keyframes track0 { 0%, 10% { fill: #2a2a27; } 13%, 84% { fill: #f6b519; } 90%, 100% { fill: #2a2a27; } }
  .knob0 { transform: translateX(24px); animation: knob0 9s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes knob0 { 0%, 10% { transform: translateX(0px); } 13%, 84% { transform: translateX(24px); } 90%, 100% { transform: translateX(0px); } }
  .lit0 { opacity: 1; animation: lit0 9s ease-in-out infinite; }
  @keyframes lit0 { 0%, 10% { opacity: 0; } 13%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
  .card0 { opacity: 1; animation: card0 9s ease-in-out infinite; }
  @keyframes card0 { 0%, 10% { opacity: .28; } 13%, 84% { opacity: 1; } 90%, 100% { opacity: .28; } }
  .track1 { fill: #f6b519; animation: track1 9s ease-in-out infinite; }
  @keyframes track1 { 0%, 22.22% { fill: #2a2a27; } 25.22%, 84% { fill: #f6b519; } 90%, 100% { fill: #2a2a27; } }
  .knob1 { transform: translateX(24px); animation: knob1 9s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes knob1 { 0%, 22.22% { transform: translateX(0px); } 25.22%, 84% { transform: translateX(24px); } 90%, 100% { transform: translateX(0px); } }
  .lit1 { opacity: 1; animation: lit1 9s ease-in-out infinite; }
  @keyframes lit1 { 0%, 22.22% { opacity: 0; } 25.22%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
  .card1 { opacity: 1; animation: card1 9s ease-in-out infinite; }
  @keyframes card1 { 0%, 22.22% { opacity: .28; } 25.22%, 84% { opacity: 1; } 90%, 100% { opacity: .28; } }
  .track2 { fill: #f6b519; animation: track2 9s ease-in-out infinite; }
  @keyframes track2 { 0%, 34.44% { fill: #2a2a27; } 37.44%, 84% { fill: #f6b519; } 90%, 100% { fill: #2a2a27; } }
  .knob2 { transform: translateX(24px); animation: knob2 9s cubic-bezier(.65,0,.35,1) infinite; }
  @keyframes knob2 { 0%, 34.44% { transform: translateX(0px); } 37.44%, 84% { transform: translateX(24px); } 90%, 100% { transform: translateX(0px); } }
  .lit2 { opacity: 1; animation: lit2 9s ease-in-out infinite; }
  @keyframes lit2 { 0%, 34.44% { opacity: 0; } 37.44%, 84% { opacity: 1; } 90%, 100% { opacity: 0; } }
  .card2 { opacity: 1; animation: card2 9s ease-in-out infinite; }
  @keyframes card2 { 0%, 34.44% { opacity: .28; } 37.44%, 84% { opacity: 1; } 90%, 100% { opacity: .28; } }
</style>

<rect width="1200" height="480" fill="#0c0c0b"/>
<line x1="56" y1="52" x2="356" y2="52" stroke="#2a2a27"/>
<text class="mono" x="56" y="78" font-size="12" letter-spacing="2" fill="#f6b519">03</text>
<text class="mono" x="356" y="78" font-size="12" letter-spacing="3" text-anchor="end" fill="#74736b">KEYS</text>
<text class="sans" x="400" y="86" font-size="40" font-weight="800" letter-spacing="-1.4" fill="#f0eee6">Three keys, <tspan fill="#f6b519">all on the server.</tspan></text>
<text class="mono" x="56" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">.ENV.LOCAL · VERCEL ENVIRONMENT VARIABLES</text>
<text class="mono" x="620" y="132" font-size="11" letter-spacing="2.4" fill="#74736b">WHAT EACH ONE SWITCHES ON</text>
  <!-- TMDB_TOKEN -->
  <rect x="56" y="150" width="504" height="72" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="76" y="181" font-size="15" font-weight="700" letter-spacing="0.6" fill="#f0eee6">TMDB_TOKEN</text>
  <text class="mono" x="76" y="202" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">themoviedb.org → Settings → API</text>
  <rect class="track0" x="480" y="172" width="52" height="28" rx="14"/>
  <circle class="knob0" cx="494" cy="186" r="10" fill="#f0eee6"/>
  <g class="lit0">
    <path d="M540 186 H620" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
    <rect x="620" y="150" width="524" height="72" fill="none" stroke="#f6b519"/>
  </g>
  <g class="card0">
    <rect x="620" y="150" width="524" height="72" fill="#131312" stroke="#2a2a27" stroke-opacity=".6"/>
    <text class="sans" x="640" y="181" font-size="18" font-weight="700" fill="#f0eee6">The catalogue</text>
    <text class="mono" x="640" y="202" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">trending · in cinemas · top rated · trailers</text>
    <rect x="1016" y="168" width="22" height="36" fill="url(#t3)" /><rect x="1044" y="168" width="22" height="36" fill="url(#t4)" /><rect x="1072" y="168" width="22" height="36" fill="url(#t5)" /><rect x="1100" y="168" width="22" height="36" fill="url(#t6)" />
  </g>
  <!-- OMDB_KEY -->
  <rect x="56" y="234" width="504" height="72" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="76" y="265" font-size="15" font-weight="700" letter-spacing="0.6" fill="#f0eee6">OMDB_KEY</text>
  <text class="mono" x="76" y="286" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">omdbapi.com → API key</text>
  <rect class="track1" x="480" y="256" width="52" height="28" rx="14"/>
  <circle class="knob1" cx="494" cy="270" r="10" fill="#f0eee6"/>
  <g class="lit1">
    <path d="M540 270 H620" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
    <rect x="620" y="234" width="524" height="72" fill="none" stroke="#f6b519"/>
  </g>
  <g class="card1">
    <rect x="620" y="234" width="524" height="72" fill="#131312" stroke="#2a2a27" stroke-opacity=".6"/>
    <text class="sans" x="640" y="265" font-size="18" font-weight="700" fill="#f0eee6">Critics' scores</text>
    <text class="mono" x="640" y="286" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">IMDb · Rotten Tomatoes · Metacritic</text>
    <rect x="978" y="254" width="46" height="32" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="1001" y="266" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="#74736b">IMDb</text>
      <text class="sans" x="1001" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#f0eee6">9.1</text><rect x="1030" y="254" width="46" height="32" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="1053" y="266" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="#74736b">RT</text>
      <text class="sans" x="1053" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#f0eee6">94%</text><rect x="1082" y="254" width="46" height="32" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="1105" y="266" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="#74736b">MC</text>
      <text class="sans" x="1105" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#f0eee6">85</text>
  </g>
  <!-- WATCHMODE_KEY -->
  <rect x="56" y="318" width="504" height="72" fill="#131312" stroke="#2a2a27"/>
  <text class="mono" x="76" y="349" font-size="15" font-weight="700" letter-spacing="0.6" fill="#f0eee6">WATCHMODE_KEY</text>
  <text class="mono" x="76" y="370" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">api.watchmode.com → free plan</text>
  <rect class="track2" x="480" y="340" width="52" height="28" rx="14"/>
  <circle class="knob2" cx="494" cy="354" r="10" fill="#f0eee6"/>
  <g class="lit2">
    <path d="M540 354 H620" fill="none" stroke="#f6b519" stroke-width="1.5" class="flow"/>
    <rect x="620" y="318" width="524" height="72" fill="none" stroke="#f6b519"/>
  </g>
  <g class="card2">
    <rect x="620" y="318" width="524" height="72" fill="#131312" stroke="#2a2a27" stroke-opacity=".6"/>
    <text class="sans" x="640" y="349" font-size="18" font-weight="700" fill="#f0eee6">Where to watch</text>
    <text class="mono" x="640" y="370" font-size="10.5" letter-spacing="0.4" fill="#a8a79f">a link straight to the film on each service</text>
    <rect x="1068" y="342" width="60" height="24" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="1098" y="358" text-anchor="middle" font-size="9" letter-spacing="1" fill="#f0eee6">HOTSTAR ↗</text><rect x="1016" y="342" width="46" height="24" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="1039" y="358" text-anchor="middle" font-size="9" letter-spacing="1" fill="#f0eee6">PRIME ↗</text><rect x="946" y="342" width="64" height="24" fill="#1b1b19" stroke="#2a2a27"/>
      <text class="mono" x="978" y="358" text-anchor="middle" font-size="9" letter-spacing="1" fill="#f0eee6">APPLE TV ↗</text>
  </g>

<!-- the page holds none of them -->
<g transform="translate(56 408)">
  <path d="M6 12v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#f6b519" stroke-width="2"/>
  <rect x="2" y="12" width="22" height="16" fill="#f6b519"/>
</g>
<text class="mono" x="94" y="422" font-size="11" letter-spacing="1.4" fill="#f0eee6">THE PAGE HOLDS 0 KEYS — IT CALLS /api/*, AND THE SERVER ADDS THEM</text>
<text class="mono" x="94" y="440" font-size="11" letter-spacing="1.4" fill="#74736b">NO KEY, OR NO ANSWER? NOW SHOWING AND TRENDING FALL BACK TO LISTS SAVED EACH MORNING</text>
</svg>
